<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MillsGPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1430;
    --amber: #ffb020;
    --idle: rgba(255, 255, 255, 0.35);
    --listening: #3ddc84;
    --thinking: #4aa3ff;
    --speaking: #ffb020;
    --ring: var(--idle);
    --size: min(62vmin, 560px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--navy);
    color: #fff;
    font-family: Inter, system-ui, sans-serif;
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  /* NOTB art behind everything, darkened and blurred so Darrick stands out. */
  .backdrop {
    position: fixed;
    inset: -40px;
    background: url("/img/notb") center / cover no-repeat,
                radial-gradient(circle at 50% 40%, #1b2d63, var(--navy));
    filter: blur(8px) brightness(0.35);
    z-index: -1;
  }

  .logo {
    position: fixed;
    top: clamp(14px, 3vmin, 32px);
    left: clamp(16px, 3vmin, 36px);
    margin: 0;
    font-family: Bungee, Impact, "Arial Black", sans-serif;
    font-weight: 400;
    font-size: clamp(40px, 9.5vmin, 116px);
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--amber);
    /* LED-board dots, echoing the Numbers on the Board logo. */
    background: radial-gradient(circle, var(--amber) 55%, #b86e00 60%, transparent 62%) 0 0 / 5px 5px;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 176, 32, 0.55));
  }
  .logo span { -webkit-text-fill-color: #fff; color: #fff; background: none; }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(18px, 4vmin, 36px);
    padding: 16px;
  }

  .avatar {
    position: relative;
    width: var(--size);
    aspect-ratio: 1;
  }
  .avatar img, .avatar .placeholder {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }
  .placeholder {
    display: none;
    place-items: center;
    background: #1b2d63;
    font-family: Bungee, Impact, sans-serif;
    font-size: calc(var(--size) / 4);
    color: var(--amber);
  }
  .avatar.missing img { display: none; }
  .avatar.missing .placeholder { display: grid; }

  .ring {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 6px solid var(--ring);
    box-shadow: 0 0 36px var(--ring), inset 0 0 24px var(--ring);
    transition: border-color 0.25s, box-shadow 0.25s;
  }

  body[data-state="listening"] { --ring: var(--listening); }
  body[data-state="thinking"]  { --ring: var(--thinking); }
  body[data-state="speaking"]  { --ring: var(--speaking); }

  body[data-state="listening"] .ring { border-width: 8px; }
  body[data-state="speaking"] .ring { animation: pulse 0.9s ease-in-out infinite; }
  body[data-state="thinking"] .ring {
    border-color: transparent;
    background: conic-gradient(from 0deg, transparent 0 55%, var(--thinking) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
    box-shadow: none;
    animation: spin 1.1s linear infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--ring), inset 0 0 20px var(--ring); }
    50% { transform: scale(1.035); box-shadow: 0 0 70px var(--ring), inset 0 0 30px var(--ring); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .label {
    min-height: 1.4em;
    font-size: clamp(18px, 3vmin, 26px);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ring);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
  }
  body[data-state="idle"] .label { color: #fff; }

  button {
    font: 700 clamp(16px, 2.6vmin, 22px) Inter, system-ui, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.8em 2.6em;
    border-radius: 999px;
    border: 2px solid var(--amber);
    background: var(--amber);
    color: var(--navy);
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s, background 0.2s;
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  body[data-state="listening"] button { background: var(--listening); border-color: var(--listening); }
  button:disabled { opacity: 0.35; cursor: default; }
  .hint { font-size: 13px; opacity: 0.6; margin-top: -12px; }

  @media (prefers-reduced-motion: reduce) {
    .ring { animation-duration: 3s !important; }
  }
</style>
</head>
<body data-state="offline">
<div class="backdrop"></div>
<h1 class="logo">Mills<span>GPT</span></h1>

<main>
  <div class="avatar" id="avatar">
    <div class="ring"></div>
    <img src="/img/darrick" alt="Darrick Miller" onerror="document.getElementById('avatar').classList.add('missing')">
    <div class="placeholder">DM</div>
  </div>
  <div class="label" id="label" aria-live="polite">Connecting…</div>
  <button id="talk" disabled>Talk</button>
  <div class="hint">or press space</div>
</main>

<script>
  const LABELS = { idle: "Ready", listening: "Listening…", thinking: "Thinking…", speaking: "Speaking…" };
  const label = document.getElementById("label");
  const talk = document.getElementById("talk");
  let socket = null;
  let noteTimer = null;

  function render(state, note) {
    document.body.dataset.state = state;
    clearTimeout(noteTimer);
    if (state === "offline") {
      label.textContent = "Not connected";
    } else if (state === "idle" && note) {
      // Why the last turn ended early, then back to normal.
      label.textContent = note;
      noteTimer = setTimeout(() => { label.textContent = LABELS.idle; }, 3000);
    } else {
      label.textContent = LABELS[state] || state;
    }
    talk.disabled = !(state === "idle" || state === "listening");
    talk.textContent = state === "listening" ? "Send" : "Talk";
  }

  function connect() {
    socket = new WebSocket(`ws://${location.host}/ws`);
    socket.onmessage = (event) => {
      const { state, note } = JSON.parse(event.data);
      render(state, note);
    };
    socket.onclose = () => {
      render("offline");
      setTimeout(connect, 1000);
    };
  }

  function toggle() {
    if (!talk.disabled && socket && socket.readyState === WebSocket.OPEN) socket.send("toggle");
  }

  talk.addEventListener("click", toggle);
  document.addEventListener("keydown", (event) => {
    if (event.code !== "Space" || event.repeat) return;
    event.preventDefault();  // no page scroll, and no double-fire via the focused button
    toggle();
  });

  connect();
</script>
</body>
</html>
